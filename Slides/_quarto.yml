# Project-level format is revealjs ONLY. Listing html here too would make every
# deck render to both formats, colliding on the same .html output. HTML pages
# (the landing page) opt in via `format: html` in their own front matter.
format:
  revealjs:
    footer: "[DS722 — Ladenheim](index.html)"
    scrollable: true
    slide-number: c/t
    show-slide-number: all
    chalkboard: true
    html-math-method: mathjax
    echo: true
    code-fold: true
